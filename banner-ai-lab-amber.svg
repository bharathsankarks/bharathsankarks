<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Deep carbon background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Amber glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Warm secondary glow -->
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    </pattern>

    <!-- Soft glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <circle cx="500" cy="260" r="340" fill="url(#amberGlow)"/>
  <circle cx="1000" cy="240" r="340" fill="url(#warmGlow)"/>

  <!-- Grid (AI lab dashboard feel) -->
  <rect width="1500" height="500" fill="url(#grid)" opacity="0.45"/>

  <!-- Data flow lines -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.22">
    <line x1="200" y1="150" x2="1300" y2="150"/>
    <line x1="200" y1="260" x2="1300" y2="260"/>
    <line x1="200" y1="370" x2="1300" y2="370"/>
  </g>

  <g stroke="#fb7185" stroke-width="1" opacity="0.15">
    <line x1="300" y1="210" x2="1200" y2="210"/>
    <line x1="300" y1="310" x2="1200" y2="310"/>
  </g>

  <!-- AI nodes -->
  <g fill="#f59e0b" opacity="0.75" filter="url(#softGlow)">
    <circle cx="320" cy="150" r="3"/>
    <circle cx="650" cy="260" r="3"/>
    <circle cx="950" cy="370" r="3"/>
    <circle cx="1180" cy="210" r="3"/>
  </g>

  <g fill="#fb7185" opacity="0.55">
    <circle cx="420" cy="300" r="2.5"/>
    <circle cx="780" cy="200" r="2.5"/>
    <circle cx="1080" cy="330" r="2.5"/>
  </g>

  <!-- Name -->
  <text x="50%" y="43%" text-anchor="middle"
        font-size="64"
        fill="#ffffff"
        font-family="Poppins, Arial"
        font-weight="800"
        filter="url(#softGlow)">
    Bharath Sankarks
  </text>

  <!-- Subtitle -->
  <text x="50%" y="54%" text-anchor="middle"
        font-size="20"
        fill="#f59e0b"
        font-family="Poppins, Arial"
        opacity="0.95">
    AI & Data Science Student • Machine Learning • Python • Data Analytics
  </text>

  <!-- Bottom accent -->
  <line x1="520" y1="410" x2="980" y2="410" stroke="#fb7185" stroke-width="2" opacity="0.5"/>

</svg>